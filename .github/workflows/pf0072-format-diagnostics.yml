name: PF-007.2 temporary formatting diagnostics

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/pf0072-format-diagnostics.yml'

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Print exact Prettier patch
        run: |
          npx prettier src/features/home/HomePage.test.tsx src/features/scenario-workspace/scenarioStore.test.ts src/features/scenarios/ScenariosPage.test.tsx src/i18n/resources.ts --write
          echo 'PF0072_PATCH_BEGIN'
          git diff -- src/features/home/HomePage.test.tsx src/features/scenario-workspace/scenarioStore.test.ts src/features/scenarios/ScenariosPage.test.tsx src/i18n/resources.ts
          echo 'PF0072_PATCH_END'
