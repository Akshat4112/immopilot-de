name: PF-007.5 formatting diagnostics
on:
  pull_request:
    paths: ['.github/workflows/pf0075-format-debug.yml']
permissions:
  contents: read
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: |
          npx prettier src/components/ThemeSelector.test.tsx --write
          echo 'PF0075_DIFF_START'
          git diff -- src/components/ThemeSelector.test.tsx
          echo 'PF0075_DIFF_END'
