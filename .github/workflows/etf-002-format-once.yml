name: One-time ETF-002 formatter
on:
  push:
    branches:
      - feat/etf-002-after-tax-projection
    paths:
      - .github/workflows/etf-002-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx --no-install prettier --write src/domain/etfProjection.ts src/domain/etfProjection.test.ts
      - run: |
          if git diff --quiet -- src/domain/etfProjection.ts src/domain/etfProjection.test.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/domain/etfProjection.ts src/domain/etfProjection.test.ts
          git commit -m "style(ETF-002): apply pinned Prettier formatter"
          git push origin HEAD:feat/etf-002-after-tax-projection
