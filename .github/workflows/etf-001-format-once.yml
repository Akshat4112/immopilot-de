name: One-time ETF-001 formatter
on:
  push:
    branches:
      - feat/etf-001-german-tax-engine
    paths:
      - .github/workflows/etf-001-format-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'Akshat4112/immopilot-de'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install repository-pinned dependencies
        run: npm ci
      - name: Format only ETF-001 files
        run: npx --no-install prettier --write src/domain/etfTax.ts src/domain/etfTax.test.ts
      - name: Commit formatted source on this branch only
        run: |
          if git diff --quiet -- src/domain/etfTax.ts src/domain/etfTax.test.ts; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/domain/etfTax.ts src/domain/etfTax.test.ts
          git commit -m "style(ETF-001): apply pinned Prettier formatter"
          git push origin HEAD:feat/etf-001-german-tax-engine
