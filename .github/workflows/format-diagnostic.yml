name: Format diagnostic

on:
  push:
    branches:
      - cf-004-mortgage-payment-calculator

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Print formatter diff
        run: |
          npx prettier src/domain/mortgage/calculate-payment.ts --write
          git diff --no-color
