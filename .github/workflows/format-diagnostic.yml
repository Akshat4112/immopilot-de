name: Format diagnostic

on:
  push:
    branches:
      - cf-004-mortgage-payment-calculator

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: |
          npx prettier src/domain/mortgage/calculate-payment.test.ts --write
          git diff --no-color
